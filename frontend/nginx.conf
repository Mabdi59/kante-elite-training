server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://kanteelitetraining.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name kanteelitetraining.com;

    return 301 https://kanteelitetraining.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.kanteelitetraining.com;

    return 301 https://kanteelitetraining.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kanteelitetraining.com;

    ssl_certificate /etc/letsencrypt/live/kanteelitetraining.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kanteelitetraining.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://kanteelitetraining.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kanteelitetraining.com;

    root /var/www/html;
    index index.html;
    client_max_body_size 24M;

    ssl_certificate /etc/letsencrypt/live/kanteelitetraining.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kanteelitetraining.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
