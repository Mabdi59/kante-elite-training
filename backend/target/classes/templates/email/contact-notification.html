<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8" />
  <title>New Contact Form Submission</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f4f4; font-family: Arial, sans-serif; }
    .wrapper { max-width: 600px; margin: 32px auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .header { background: #0a0a0a; padding: 28px 36px; }
    .header h1 { color: #f59e0b; font-size: 18px; margin: 0; }
    .content { padding: 32px 36px; }
    .field { margin-bottom: 16px; }
    .label { font-size: 12px; color: #6b7280; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
    .value { font-size: 15px; color: #111827; }
    .message-box { background: #f9fafb; border-left: 3px solid #f59e0b; padding: 16px; margin-top: 4px; white-space: pre-wrap; font-size: 14px; color: #374151; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>New Contact Form Submission — Kante Elite Training</h1>
  </div>
  <div class="content">
    <div class="field">
      <div class="label">Name</div>
      <div class="value" th:text="${contact.name}">Name</div>
    </div>
    <div class="field">
      <div class="label">Email</div>
      <div class="value" th:text="${contact.email}">email</div>
    </div>
    <div class="field" th:if="${contact.phone != null and !contact.phone.isEmpty()}">
      <div class="label">Phone</div>
      <div class="value" th:text="${contact.phone}">phone</div>
    </div>
    <div class="field" th:if="${contact.subject != null and !contact.subject.isEmpty()}">
      <div class="label">Subject</div>
      <div class="value" th:text="${contact.subject}">subject</div>
    </div>
    <div class="field">
      <div class="label">Message</div>
      <div class="message-box" th:text="${contact.message}">message</div>
    </div>
  </div>
</div>
</body>
</html>
