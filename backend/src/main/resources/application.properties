# ─── Application ─────────────────────────────────────────────────────────────
spring.application.name=kante-elite-training

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ─── PostgreSQL ───────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kante_elite}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ─── Stripe ───────────────────────────────────────────────────────────────────
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# ─── Email ────────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.sendgrid.net}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:apikey}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.email.from=${EMAIL_FROM:noreply@kanteelitetraining.com}
app.email.admin=${EMAIL_ADMIN:admin@kanteelitetraining.com}
app.email.enabled=${EMAIL_ENABLED:false}

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ─── Frontend URL ─────────────────────────────────────────────────────────────
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.kanteelite=INFO
logging.level.org.flywaydb=INFO
