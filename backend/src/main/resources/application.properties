# Application
spring.application.name=kante-elite-training

# Server
server.port=8080
server.servlet.context-path=/

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kante_elite}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres1}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:true}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Frontend URL
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Payments
# Set to true and provide STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET to activate Stripe checkout.
app.payments.enabled=${APP_PAYMENTS_ENABLED:false}

# Tournament registration uploads and follow up
app.uploads.dir=${APP_UPLOADS_DIR:uploads}
app.tournaments.follow-up.cron=${TOURNAMENT_FOLLOW_UP_CRON:0 0 */6 * * *}

# Multipart uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=24MB

# JWT
app.jwt.secret=${JWT_SECRET:kante-elite-training-jwt-secret-key-that-is-at-least-256-bits-long-change-in-production}
# Access token: 15 minutes
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Refresh token: 7 days
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Default admin bootstrap (override ALL three in production via environment variables)
app.admin.email=${ADMIN_EMAIL:admin@kanteelite.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.name=${ADMIN_NAME:Kante Elite Admin}
